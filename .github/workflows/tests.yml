name: Plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'maibot-plugin-sdk>=2.8.1,<3' ruff
      - name: Check source and tests
        run: |
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -v
